# Create the Slack app from this manifest: api.slack.com/apps -> Create New App -> From a manifest
display_information:
  name: Sales Agent
  description: Researches your targets, drafts personal emails, tracks calls and meetings.
  background_color: "#1d2433"
features:
  bot_user:
    display_name: Sales Agent
    always_online: true
  slash_commands:
    - command: /lead
      description: Add targets; I research them and draft personal emails
      usage_hint: "Jane Kim, CEO of Acme Commerce, jane@acme.com"
      should_escape: false
    - command: /call
      description: Log a call; I review it and set the next step
      usage_hint: "Jane Kim connected wants pricing, call back Tuesday"
      should_escape: false
    - command: /meeting
      description: Book a meeting and email a calendar invite
      usage_hint: "Jane Kim 2026-11-03 14:00 30"
      should_escape: false
    - command: /sales
      description: "Numbers, tomorrow's plan, pipeline, leads, tasks"
      usage_hint: "today | week | tomorrow | pipeline | lead <name> | done <id> | help"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - chat:write.public
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
